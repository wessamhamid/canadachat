name: Bug
description: Something on the site or in the code doesn't work.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How can we reproduce it?
      placeholder: |
        1. Open ...
        2. Type ...
        3. See ...
  - type: input
    id: env
    attributes:
      label: Browser and device, or Python version if it's the server
      placeholder: Safari on iPhone 15 / Firefox on Windows / Python 3.12 on Ubuntu 24.04
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or logs
      description: Please remove anything personal (postal codes, names, keys) before pasting.
